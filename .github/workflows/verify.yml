name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  reproducible-build:
    name: reproducible build + gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      - name: Record the committed artifact
        run: |
          echo "committed_bytes=$(wc -c < dist/index.html)" >> "$GITHUB_ENV"
          echo "committed_sha=$(sha256sum dist/index.html | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Rebuild from source
        run: python3 build154.py

      - name: The rebuild must match the committed artifact
        run: |
          rebuilt_sha=$(sha256sum dist/index.html | cut -d' ' -f1)
          echo "committed : $committed_sha ($committed_bytes bytes)"
          echo "rebuilt   : $rebuilt_sha ($(wc -c < dist/index.html) bytes)"
          test "$rebuilt_sha" = "$committed_sha"

      # The browser is part of the build's evidence, so it is pinned like everything else:
      # `npm ci` installs the exact playwright in test/package-lock.json and nothing else, and
      # `playwright install` then fetches the one Chromium build that version ships with. The old
      # `|| npm install` fallback silently re-resolved ^1.56.0 to whatever was newest that morning,
      # which is drift wearing a lockfile. If the lockfile is wrong, fail here and say so.
      - name: Gates
        run: |
          npm --prefix test ci --no-audit --no-fund
          (cd test && npx playwright install --with-deps chromium)
          node test/gate154.js dist/index.html

      - name: Summary
        if: always()
        run: |
          {
            echo "### DexLadder build"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| bytes | $committed_bytes |"
            echo "| sha256 | \`$committed_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"
